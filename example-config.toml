# Runnly Configuration Examples
# Copy sections to ~/.codex/config.toml (Linux/Mac) or %USERPROFILE%\.codex\config.toml (Windows)

# ====================
# BASIC CONFIGURATION
# ====================

# Choose your default provider (deepseek, openai, anthropic, ollama, etc.)
model_provider = "deepseek"

# Choose your model
model = "deepseek-v4-flash"

# ====================
# DEEPSEEK (Built-in)
# ====================
# Fast, cost-effective provider with strong reasoning
# Just set: export DEEPSEEK_API_KEY=your-key-here

# Use deepseek-v4-flash for speed and economy
model_provider = "deepseek"
model = "deepseek-v4-flash"

# Or use deepseek-v4-pro for better reasoning
# model_provider = "deepseek"
# model = "deepseek-v4-pro"

# ====================
# OPENAI (Built-in)
